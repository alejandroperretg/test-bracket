# Publish docs/ (the project page) to GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Then run it from Actions > pages > Run workflow after refreshing the page with
# `uv run python make_site.py` and pushing. The page is then at https://<user>.github.io/<repo>/.
# Note: Pages on a private repository needs a paid GitHub plan.

name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
